{% extends "base.html" %}
{% block body %}
<form class="card auth wideauth" method="post">
  <h1>Create your profile</h1><p class="muted">Your details are saved in MySQL and your connections build the network graph.</p>
  <label>Full name<input name="name" required></label>
  <label>Email<input type="email" name="email" required></label>
  <label>Password (min 8 characters)<input type="password" name="password" minlength="8" required></label>
  <label>Headline<input name="headline" placeholder="e.g. CSE student at PES University"></label>
  <label>City<input name="location"></label>
  <div class="two"><label>School / college<input name="school"></label><label>Degree<input name="degree" placeholder="B.Tech"></label><label>Graduation year<input name="grad_year" inputmode="numeric"></label></div>
  <fieldset><legend>Your skills</legend><div class="checks">{% for s in skills %}<label><input type="checkbox" name="skills" value="{{ s.skill_id }}"> {{ s.name }}</label>{% endfor %}</div></fieldset>
  <button class="btn">Create account</button>
  <p class="muted small">Already registered? <a href="/login">Log in</a></p>
</form>
{% endblock %}
